name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-15
    # Signing secrets live only in this protected environment, restricted to v* tags.
    environment: release
    env:
      SIGNING_IDENTITY: Arbor Self-Signed Code Signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate into a temporary keychain
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/arbor-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build universal Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          xcodegen generate
          xcodebuild -project Arbor.xcodeproj -scheme Arbor -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Sign
        run: |
          app=build/Build/Products/Release/Arbor.app
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --requirements - "$app"
          lipo -archs "$app/Contents/MacOS/Arbor"

      - name: Package
        run: scripts/package-release.sh build/Build/Products/Release/Arbor.app "${GITHUB_REF_NAME#v}" dist

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${previous:+$previous..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            git log --no-merges --pretty='- %s (%h)' "$range"
            echo
            echo "## Checksums (SHA-256)"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Arbor is signed with a self-signed certificate, not notarized."
            echo "See the README for how to open it on macOS 15 and later."
          } > dist/NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Arbor ${GITHUB_REF_NAME#v}" \
            --notes-file dist/NOTES.md \
            dist/*.zip dist/*.dmg dist/SHA256SUMS.txt

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
