excluded:
  - "**/.build"
  - DerivedData
  - "*.xcodeproj"
disabled_rules:
  - trailing_comma        # SwiftFormat owns comma style
  - opening_brace         # SwiftFormat owns brace wrapping
line_length:
  warning: 120
  ignores_comments: true
identifier_name:
  excluded: [x, y, dx, dy, id, xs, ys, db]   # geometry code, GRDB database handles
